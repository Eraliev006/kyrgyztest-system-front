[project]
name = "qa"
version = "0.1.0"
description = "UI smoke tests for the KyrgyzTest frontend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.49.0",
    "pydantic-settings>=2.14.2",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: fast critical-path checks that gate CI",
    "ui: UI (Playwright) tests",
]

[tool.playwright]
browser = "chromium"
